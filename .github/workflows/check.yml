name: Browser PLC validation
on:
  push:
    branches: [main, feature/browser-plc-ladder-v1]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm test
      - run: npm run build
